name: Release
on:
  push:
    tags:
      - v[0-9]+\.[0-9]+\.[0-9]+\+sylr\.[0-9]+
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # role: goreleaser restores the cross-compile build cache warmed by the
      # GoReleaser snapshot job in the test workflow.
      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          role: goreleaser

      # dockers_v2 builds multi-arch (linux/amd64+arm64) images, so the
      # non-native arch needs QEMU plus a buildx builder.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser's sboms config shells out to syft, which goreleaser-action
      # does not bundle, so install it onto PATH first.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (or fine-grained token) with contents:write on sylr/homebrew-tap,
          # since the built-in GITHUB_TOKEN is scoped only to this repo.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Mint a GitHub build-provenance attestation for every released file
      # (archives, DEBs, RPMs, SBOMs) listed in goreleaser's checksum file.
      # Verify with: gh attestation verify <file> --owner sylr
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: dist/SHA256SUMS

      # Attest the pushed Docker images via the digests goreleaser recorded.
      # Verify with: gh attestation verify oci://ghcr.io/sylr/natscli:<tag> --owner sylr
      - name: Attest container images
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: dist/digests.txt
