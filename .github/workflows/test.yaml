name: NATS CLI Testing

permissions:
  contents: read

defaults:
  run:
    shell: bash

on: [push, pull_request]

jobs:
  lint:
    name: Running linting (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          role: lint

      - name: Install linting tools
        shell: bash --noprofile --norc -x -eo pipefail {0}
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/client9/misspell/cmd/misspell@latest

      - name: Lint
        shell: bash --noprofile --norc -x -eo pipefail {0}
        run: |
          PATH=$PATH:$GOPATH/bin
          GO_LIST=$(go list ./... | grep -F -e asciigraph -v)
          $(exit $(go fmt $GO_LIST | wc -l))
          go vet -composites=false $GO_LIST
          find . -type f -name "*.go" | grep -F -e asciigraph -v | xargs misspell -error -locale US
          staticcheck -f stylish $GO_LIST

  test:
    name: Running tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          role: test

      - name: Build
        run: |
          cd nats
          go build

      - name: Run Linux tests
        if: startsWith(runner.os, 'Linux')
        shell: bash --noprofile --norc -x -eo pipefail {0}
        run: |
          set -e
          go list ./... | grep -F -e asciigraph -v | xargs go test -v --failfast -p=1
          set +e

      - name: Run Windows tests
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-LoggedCommand {
            param([string]$command)
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Error "x Command failed: $command"
              exit $LASTEXITCODE
            }
          }

          go list ./... | ForEach-Object{
            if ($_ -notmatch 'asciigraph') {
              Invoke-LoggedCommand "go test -v --failfast -p=1 $_"
            }
          }

  fips:
    name: Running FIPS tests (ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          role: fips

      - name: Build
        run: |
          cd nats
          go build

      - name: Run FIPS tests
        shell: bash --noprofile --norc -x -eo pipefail {0}
        env:
          CI: "true"
        run: |
          cd nats/tests
          go test -tags fips -v --failfast -p=1 -run FIPS .

  build:
    name: GoReleaser snapshot build (ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # role: goreleaser shares the build cache with the release workflow, so a
      # real release restores the cross-compile cache this snapshot warms.
      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          role: goreleaser

      # Cross-compiles every target in .goreleaser.yml (no archives/docker/
      # publish), warming the build cache the release reuses.
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: build --snapshot --clean
