project_name: natscli
version: 2

before:
  hooks:
    - go mod tidy

release:
  github:
    owner: sylr
    name: natscli
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto

changelog:
  disable: false

builds:
  - main: ./nats
    id: nats
    binary: nats
    env:
      - GO111MODULE=on
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version=v{{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: "386"
      - goos: windows
        goarch: arm

archives:
  - name_template: "nats-v{{.Version}}-{{.Os}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}"
    wrap_in_directory: true
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# Emit a sha256sum-style list of pushed Docker manifest digests so the release
# workflow can mint a GitHub build-provenance attestation for each image.
docker_digest:
  name_template: "digests.txt"

sboms:
  - artifacts: archive

homebrew_casks:
  - name: nats
    binaries:
      - nats
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/sylr/natscli"
    description: "NATS utility"
    skip_upload: auto
    repository:
      owner: sylr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Homebrew deprecated the `postflight` / `uninstall_preflight` stanzas that
    # GoReleaser's `hooks:` emits (`*_steps` replace them), and the replacements take a
    # declarative step DSL instead of arbitrary Ruby, which GoReleaser cannot emit.
    # Inject the stanza verbatim through custom_block instead.
    #
    # Quarantine must be stripped before any artifact execs the staged binary, or macOS
    # SIGKILLs it (`generate_completions_from_executable` below runs it). `preflight_steps`
    # is first in Homebrew's artifact sort order, so it wins over every other phase.
    # `{{ `...` }}` protects Homebrew's own `{{token}}` placeholders from GoReleaser
    # templating. Homebrew's `{{bash_completion}}` & co. are unusable here: in a cask they
    # resolve against the same-named artifact stanzas and blow up.
    #
    # `-dr` on the single staged binary rather than on staged_path: recursive xattr follows
    # symlinks out of the tree, and this is the only file that gets executed. `-r` is kept
    # because plain `-d` exits 1 when the attribute is already absent.
    custom_block: |
      preflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/nats"]
        end
      end
    # cobra already invokes the `completion` subcommand; extra args would produce
    # `nats completion completion <shell>`. The archive is wrapped in a directory but the
    # cask `rename` flattens it to `nats` at the staged root before artifacts install.
    generate_completions_from_executable:
      executable: nats
      shell_parameter_format: cobra
      base_name: nats
      shells:
      - bash
      - zsh
      - fish

nfpms:
  - file_name_template: 'nats-v{{.Version}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}'
    homepage: https://nats.io
    description: NATS Utility
    maintainer: Sylvain Rabot <sylvain@abstraction.fr>
    license: Apache 2.0
    vendor: Sylvain Rabot
    bindir: /usr/local/bin
    formats:
      - deb
      - rpm

dockers_v2:
  - id: nats
    ids:
      - nats
    images:
      - "ghcr.io/sylr/natscli"
    tags:
      # Docker tags cannot contain '+', so sanitize the +sylr.N build
      # metadata (e.g. v1.2.3+sylr.1 -> v1.2.3_sylr.1).
      - "v{{ replace .Version \"+\" \"_\" }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: "https://github.com/sylr/natscli"
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
